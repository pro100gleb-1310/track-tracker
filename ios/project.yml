# XcodeGen description of the iPhone app; the workflow turns it into an Xcode project on a Mac runner.
name: PutevoyUchet
options:
  bundleIdPrefix: ua.putevoy
  deploymentTarget:
    iOS: "15.0"
targets:
  PutevoyUchet:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: www
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Путевой учёт
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.putevoy.uchet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
