name: Expo Go (iPhone)

# Publishes the app to the owner's Expo account with EAS Update (free plan), so it opens in the Expo Go app.
# Needs the repository secret EXPO_TOKEN (an access token from expo.dev → Account settings → Access tokens).

on:
  push:
    branches: [main]
    paths: [index.html, expo/**, .github/workflows/expo.yml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Check the Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Добавьте секрет EXPO_TOKEN: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - name: Copy the app page
        run: node sync-html.js
      - name: Link the EAS project in the token owner's account (created on the first run)
        run: npx -y eas-cli@latest init --force --non-interactive
      - name: Point updates at the project
        run: |
          node -e '
            const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json","utf8"));
            const id=a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId;
            if(!id){console.error("no projectId after eas init");process.exit(1)}
            a.expo.updates={url:"https://u.expo.dev/"+id};
            fs.writeFileSync("app.json",JSON.stringify(a,null,2));console.log("project",id)'
      - name: Publish the update
        run: npx -y eas-cli@latest update --branch main --platform all --message "${{ github.sha }}" --non-interactive
